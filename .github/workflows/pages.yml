name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm install`: the project has zero dependencies.

      - name: Build pages from content/*.md
        run: node scripts/build.js

      - name: Check the committed HTML matches its markdown source
        run: |
          if ! git diff --exit-code --stat; then
            echo ""
            echo "::error::Generated HTML is out of date with content/*.md or data/figures.json."
            echo "The files listed above differ from a fresh build. Fix it locally with:"
            echo ""
            echo "    node scripts/build.js && git add -A && git commit"
            echo ""
            echo "Generated .html and llms.txt are committed on purpose, so they must be"
            echo "rebuilt and committed in the same change as the markdown they come from."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # The whole tree: assets/app.js fetches data/figures.json at runtime,
          # and the raw content/*.md files are worth serving too.
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
